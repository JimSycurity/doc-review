[project]
name = "docreview"
version = "0.1.0"
description = "Located documentation checks and advisory decision-model review"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
docreview = "docreview.cli:main"

[build-system]
requires = ["uv_build==0.12.19"]
build-backend = "uv_build"

[dependency-groups]
test = ["pytest==8.4.2"]
lint = ["ruff==0.16.9"]
typecheck = ["pyrefly==1.3.1"]
pre-commit = ["pre-commit==4.3.0"]
dev = [{include-group = "test"}, {include-group = "lint"}, {include-group = "typecheck"}, {include-group = "pre-commit"}]

[tool.uv]
required-version = "==0.12.19"
default-groups = ["dev"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-config", "--strict-markers"]
cache_dir = ".tmp/pytest-cache"

[tool.ruff]
required-version = "==0.16.9"
target-version = "py312"
line-length = 88
cache-dir = ".tmp/ruff-cache"
src = ["src"]

[tool.ruff.lint]
extend-select = ["F", "W", "E", "I", "N", "UP", "B", "C4", "C90", "FA", "ISC", "ICN", "RET", "SIM", "TID", "TC", "PTH", "TD", "NPY", "RUF", "PERF", "FURB"]
ignore = ["E501", "W191", "E111", "E114", "E117"]

[tool.ruff.lint.mccabe]
max-complexity = 7

[tool.pyrefly]
required-version = "==1.3.1"
python-version = "3.12"
preset = "strict"
use-ignore-files = false
project-includes = ["src/**/*.py", "tests/**/*.py"]
project-excludes = ["**/.venv/**", "**/.tmp/**"]
check-unannotated-defs = true
infer-return-types = "checked"

[tool.pyrefly.errors]
implicit-any-type-argument = "error"
no-any-return = "error"
unused-ignore = "error"

[tool.ruff.lint.per-file-ignores]
# The moved trial keeps one ValueError boundary for malformed external data.
"src/docreview/documentation_decisions.py" = ["TRY004"]
"src/docreview/documentation_inputs.py" = ["TRY004"]
# The TOML boundary uses the same ValueError contract for invalid declarations.
"src/docreview/configuration.py" = ["TRY004"]
